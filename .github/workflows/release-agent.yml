# Builds desktop agent installers on each OS: .dmg/.zip (macOS), .exe (Windows), .AppImage/.deb (Linux).
# Run it from the Actions tab, or push a tag like v0.2.0 (matching desktop-agent/package.json's version)
# to also attach the installers to a GitHub Release, which the server offers when DOWNLOADS_GITHUB_REPO is set.
name: Build desktop agent

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: API address built into the agent
        default: https://ai-powered-employee-performance-and.onrender.com/api
  push:
    tags: ['v*']

env:
  SERVER_URL: ${{ inputs.server_url || vars.AGENT_SERVER_URL || 'https://ai-powered-employee-performance-and.onrender.com/api' }}

jobs:
  build:
    name: Agent · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # node-gyp 9 (used by electron-builder to rebuild native modules) imports distutils, removed in Python 3.12.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Linux build dependencies for native modules
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxtst-dev libxt-dev libx11-dev libxkbfile-dev libpng-dev libxrandr-dev libxinerama-dev
      - run: npm ci
      - name: Build installers
        shell: bash
        # npm workspaces hoist electron to the root node_modules, where electron-builder doesn't look for it.
        run: |
          # An empty CSC_LINK (no signing secret) is read as a certificate path and fails the build.
          [ -n "$CSC_LINK" ] || unset CSC_LINK CSC_KEY_PASSWORD
          ELECTRON_VERSION=$(node -p "require('electron/package.json').version")
          npm run dist -w @tracker/desktop-agent -- "-c.extraMetadata.workplus.apiUrl=$SERVER_URL" "-c.electronVersion=$ELECTRON_VERSION" --publish never
        env:
          # Unsigned builds unless signing secrets are configured in the repository.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: workplus-agent-${{ runner.os }}
          path: |
            desktop-agent/release/*.dmg
            desktop-agent/release/*.zip
            desktop-agent/release/*.exe
            desktop-agent/release/*.AppImage
            desktop-agent/release/*.deb
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          fail_on_unmatched_files: true
